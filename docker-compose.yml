# Vokala monorepo — microservices orchestration
# Usage: ./run.sh  →  Production (containers)

name: vokala

services:
  # ── Frontend (Next.js) ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: vokala-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    env_file:
      - path: services/app/.env
        required: false
    networks:
      - vokala-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Future services (uncomment / add as needed) ───────────
  # api:
  #   build:
  #     context: .
  #     dockerfile: services/api/Dockerfile
  #   container_name: vokala-api
  #   restart: unless-stopped
  #   ports:
  #     - "${API_PORT:-4000}:4000"
  #   env_file:
  #     - path: services/api/.env
  #       required: false
  #   networks:
  #     - vokala-net
  #   depends_on:
  #     app:
  #       condition: service_healthy

networks:
  vokala-net:
    name: vokala-net
    driver: bridge
