# Vokala / Vakila — microservices orchestration
# Development: ./run.sh dev  (Postgres container + Next watch)
# Production:  ./run.sh prod (full stack containers)

name: vokala

services:
  postgres:
    image: postgres:16-alpine
    container_name: vokala-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vakila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vakila_dev_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-vakila}
    volumes:
      - vokala-pg-data:/var/lib/postgresql/data
    networks:
      - vokala-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vakila} -d ${POSTGRES_DB:-vakila}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rustfs-perms:
    image: alpine:3.20
    container_name: vokala-rustfs-perms
    user: root
    volumes:
      - vokala-rustfs-data:/data
      - vokala-rustfs-logs:/logs
    command: ["sh", "-c", "chown -R 10001:10001 /data /logs"]
    networks:
      - vokala-net

  rustfs:
    image: rustfs/rustfs:latest
    container_name: vokala-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-http://localhost:4000,http://127.0.0.1:4000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-vakila_rustfs_key}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-vakila_rustfs_secret_change_me}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: ${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-true}
    volumes:
      - vokala-rustfs-data:/data
      - vokala-rustfs-logs:/logs
    networks:
      - vokala-net
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-ec",
          "curl -fsS http://127.0.0.1:9000/rustfs/console/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: vokala-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-vakila}:${POSTGRES_PASSWORD:-vakila_dev_secret_change_me}@postgres:5432/${POSTGRES_DB:-vakila}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_URL: ${APP_URL:-http://localhost:4000}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-vakila_rustfs_key}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-vakila_rustfs_secret_change_me}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-vakila-attachments}
      RUSTFS_STORAGE_LIMIT_BYTES: ${RUSTFS_STORAGE_LIMIT_BYTES:-10737418240}
    env_file:
      - path: services/app/.env
        required: false
    networks:
      - vokala-net
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  vokala-pg-data:
    name: vokala-pg-data
  vokala-rustfs-data:
    name: vokala-rustfs-data
  vokala-rustfs-logs:
    name: vokala-rustfs-logs

networks:
  vokala-net:
    name: vokala-net
    driver: bridge
